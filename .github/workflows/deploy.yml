# Builds the site and deploys it to GitHub Pages. Map data comes from the `data` branch
# (overwritten on every refresh, so history stays small); without it the test map is used.
name: Викласти сайт

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Зібрати мапу з Discogs"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Nothing is deployed unless types, lint and tests pass (site and pipeline)
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Site — types, lint, tests
        working-directory: web
        run: npm ci && npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the site on lived-in data (a long flight log, a chat full of shared tracks), phone and laptop:
      # no style loaded that nobody looks at, no freezes, no runaway memory (web/e2e/load.py)
      - name: Site — load test
        working-directory: web
        run: |
          pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
          npm run build && (npx vite preview --port 4173 --strictPort &) && sleep 3
          python e2e/load.py
      - name: Pipeline — lint, tests
        working-directory: pipeline
        run: pip install -r requirements-dev.txt && ruff check . && python -m pytest -q tests

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Use the real map data if the data branch exists
        run: |
          if git fetch --depth 1 origin data 2>/dev/null; then
            rm -rf web/public/data && mkdir -p web/public/data
            git --work-tree=web/public/data checkout FETCH_HEAD -- .
            echo "Real map: $(du -sh web/public/data | cut -f1)"
          elif gh release download data-latest -p map-data.tar.gz -D /tmp 2>/dev/null; then
            rm -rf web/public/data && tar -xzf /tmp/map-data.tar.gz -C web/public
          else
            echo "No real data yet — deploying the test map."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
