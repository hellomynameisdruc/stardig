# SYSTEM's tip: every 12 hours (10:17 and 22:17 Kyiv time in winter, an hour later in summer) the
# station posts a random track from the map to COMMS · ALL, like the founder's /tip.
# Needs the repository secret SUPABASE_SERVICE_KEY (Supabase → Project Settings → API → service_role).
# "Run workflow" on the Actions tab posts one right away.
name: SYSTEM tip

on:
  schedule:
    - cron: "17 8,20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post a tip to COMMS
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python .github/scripts/tip.py
