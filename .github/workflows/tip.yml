# SYSTEM's tip on demand: "Run workflow" posts a random track from the map to COMMS · ALL, like /tip.
# The twice-a-day tips come from the database's own clock (supabase/tips-cron.sql): GitHub's schedule
# ran hours late and skipped runs.
# Needs the repository secret SUPABASE_SERVICE_KEY: Supabase → Project Settings → API Keys → a secret key
# (sb_secret_…), or the legacy service_role key.
name: SYSTEM tip

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post a tip to COMMS
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python .github/scripts/tip.py
